<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of browser UI, Express server and routes, library modules, configuration and JSON storage. Numbered order flow traces a sale through pricing, inventory, Khata, order storage and audit persistence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .section{font-size:14px;font-weight:700;letter-spacing:.5px;fill:#334155}
      .name{font-size:14px;font-weight:700}.small{font-size:12px;fill:#475569}.tiny{font-size:12px;fill:#334155}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.soft{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4}
      .ticket{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.ticketText{fill:#9f1239}
      .line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .flowLine{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#blueArrow)}
      .num{fill:#2563eb}.numText{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="28" y="36" class="title">ShopLedger | Application Architecture</text>
  <text x="28" y="58" class="subtitle">Node / Express POS · Khata credit ledger · GST invoicing · File-backed JSON store</text>

  <text x="28" y="88" class="section">CLIENT</text>
  <rect x="28" y="98" width="200" height="104" rx="10" class="box"/>
  <text x="44" y="123" class="name">Browser UI · public/</text>
  <text x="44" y="145" class="small">index.html · js/app.js</text>
  <text x="44" y="164" class="small">css/style.css</text>
  <text x="44" y="185" class="tiny">POS, orders, Khata, audit</text>

  <path d="M228 148 H267" class="line"/>
  <text x="233" y="138" class="tiny">HTTP / JSON</text>
  <text x="270" y="88" class="section">APPLICATION</text>
  <rect x="270" y="98" width="204" height="104" rx="10" class="box"/>
  <text x="286" y="123" class="name">server.js</text>
  <text x="286" y="145" class="small">Express + bodyParser</text>
  <text x="286" y="164" class="small">serves public/ · mounts /api</text>
  <text x="286" y="185" class="tiny">GET /orders/:id/invoice</text>

  <path d="M474 148 H510" class="line"/>
  <text x="510" y="88" class="section">ROUTERS · mounted at /api</text>
  <rect x="510" y="98" width="345" height="46" rx="8" class="soft"/>
  <text x="524" y="118" class="name">routes/products.js</text><text x="524" y="136" class="small">GET /products · GET /coupons</text>
  <rect x="510" y="151" width="345" height="46" rx="8" class="soft"/>
  <text x="524" y="171" class="name">routes/orders.js</text><text x="524" y="189" class="small">GET /orders · POST /orders · cancel</text>
  <rect x="510" y="204" width="345" height="46" rx="8" class="soft"/>
  <text x="524" y="224" class="name">routes/customers.js</text><text x="524" y="242" class="small">GET /customers · POST settlement</text>
  <rect x="510" y="257" width="345" height="46" rx="8" class="soft"/>
  <text x="524" y="277" class="name">routes/reports.js</text><text x="524" y="295" class="small">dashboard · GST recon · pricing preview · export</text>

  <text x="884" y="88" class="section">SETTINGS &amp; PERSISTENCE</text>
  <rect x="884" y="98" width="286" height="84" rx="10" class="soft"/>
  <text x="900" y="123" class="name">config.js</text>
  <text x="900" y="145" class="small">shop · tax / HSN slabs · coupons</text>
  <text x="900" y="164" class="small">port · inventory defaults · admin key</text>
  <rect x="884" y="210" width="286" height="84" rx="10" class="box"/>
  <text x="900" y="235" class="name">data/db.json</text>
  <text x="900" y="257" class="small">products · orders · customers</text>
  <text x="900" y="276" class="small">settlements · auditLog · ID counters</text>
  <path d="M374 202 V320 H1025 V210" class="line"/>
  <text x="704" y="315" class="tiny">lib/store.js read / write</text>
  <path d="M1025 182 V210" class="line"/>
  <text x="1036" y="201" class="tiny">reads</text>

  <text x="28" y="343" class="section">BUSINESS LOGIC · lib/</text>
  <rect x="28" y="354" width="270" height="68" rx="9" class="soft"/>
  <text x="42" y="378" class="name">pricing.js</text><text x="42" y="399" class="small">subtotal · computeTotals</text><text x="42" y="416" class="tiny">uses tax.js + coupons.js</text>
  <rect x="310" y="354" width="270" height="68" rx="9" class="soft"/>
  <text x="324" y="378" class="name">coupons.js</text><text x="324" y="399" class="small">normalizeCode · validate</text><text x="324" y="416" class="tiny">calculateDiscount · listActive</text>
  <rect x="592" y="354" width="270" height="68" rx="9" class="soft"/>
  <text x="606" y="378" class="name">tax.js</text><text x="606" y="399" class="small">getRateForItem · getSlabPercent</text><text x="606" y="416" class="tiny">splitCgstSgst</text>

  <rect x="28" y="433" width="270" height="68" rx="9" class="soft"/>
  <text x="42" y="457" class="name">inventory.js</text><text x="42" y="478" class="small">find · check · reserve · release</text><text x="42" y="495" class="tiny">sellable stock + summary</text>
  <rect x="310" y="433" width="270" height="68" rx="9" class="soft"/>
  <text x="324" y="457" class="name">ledger.js</text><text x="324" y="478" class="small">findCustomer · chargeOrderToKhata</text><text x="324" y="495" class="tiny">reverse debit · recordSettlement</text>
  <rect x="592" y="433" width="270" height="68" rx="9" class="soft"/>
  <text x="606" y="457" class="name">orders.js</text><text x="606" y="478" class="small">add · get · cancel · list</text><text x="606" y="495" class="tiny">order records + cancellation</text>

  <rect x="28" y="512" width="270" height="68" rx="9" class="soft"/>
  <text x="42" y="536" class="name">store.js</text><text x="42" y="557" class="small">read · write · appendAudit</text><text x="42" y="574" class="tiny">data/db.json adapter</text>
  <rect x="310" y="512" width="270" height="68" rx="9" class="soft"/>
  <text x="324" y="536" class="name">reports.js</text><text x="324" y="557" class="small">getDashboardSummary</text><text x="324" y="574" class="tiny">getGstReconciliation</text>
  <rect x="592" y="512" width="270" height="68" rx="9" class="soft"/>
  <text x="606" y="536" class="name">dates.js</text><text x="606" y="557" class="small">today · normalizeDateKey</text><text x="606" y="574" class="tiny">getFiscalYear</text>

  <rect x="884" y="354" width="286" height="100" rx="10" class="ticket"/>
  <text x="900" y="379" class="name ticketText">invoice.js · TICKET FOCUS</text>
  <text x="900" y="401" class="small">computeInvoiceFigures · render</text>
  <text x="900" y="421" class="small">Printable HTML from saved order</text>
  <text x="900" y="442" class="tiny ticketText">Uses config.js; does not call tax.js</text>
  <path d="M474 172 H868 V405 H884" class="line"/>
  <text x="720" y="166" class="tiny">invoice route uses orders.get + invoice.render</text>
  <rect x="884" y="470" width="286" height="110" rx="10" class="soft"/>
  <text x="900" y="495" class="name">Dependencies / usage</text>
  <text x="900" y="518" class="small">orders route → pricing, inventory,</text>
  <text x="900" y="537" class="small">coupons, ledger, orders, store</text>
  <text x="900" y="559" class="small">reports route → reports + pricing preview</text>
  <text x="900" y="576" class="tiny">products route → inventory, tax, coupons</text>

  <rect x="28" y="604" width="1142" height="156" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="46" y="629" class="section">ORDER PLACEMENT · POST /api/orders</text>
  <rect x="46" y="642" width="164" height="84" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="64" cy="660" r="12" class="num"/><text x="64" y="664" class="numText">1</text>
  <text x="82" y="664" class="name">UI submits cart</text><text x="60" y="687" class="small">public/js/app.js</text><text x="60" y="707" class="small">items + customer + coupon</text>
  <path d="M210 684 H232" class="flowLine"/>
  <rect x="236" y="642" width="164" height="84" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="254" cy="660" r="12" class="num"/><text x="254" y="664" class="numText">2</text>
  <text x="272" y="664" class="name">Resolve + validate</text><text x="250" y="687" class="small">orders route · inventory</text><text x="250" y="707" class="small">find products · check stock</text>
  <path d="M400 684 H422" class="flowLine"/>
  <rect x="426" y="642" width="164" height="84" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="444" cy="660" r="12" class="num"/><text x="444" y="664" class="numText">3</text>
  <text x="462" y="664" class="name">Compute totals</text><text x="440" y="687" class="small">pricing + coupons + tax</text><text x="440" y="707" class="small">GST on discounted lines</text>
  <path d="M590 684 H612" class="flowLine"/>
  <rect x="616" y="642" width="164" height="84" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="634" cy="660" r="12" class="num"/><text x="634" y="664" class="numText">4</text>
  <text x="652" y="664" class="name">Khata if selected</text><text x="630" y="687" class="small">ledger.chargeOrderToKhata</text><text x="630" y="707" class="small">credit check + debit</text>
  <path d="M780 684 H802" class="flowLine"/>
  <rect x="806" y="642" width="164" height="84" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="824" cy="660" r="12" class="num"/><text x="824" y="664" class="numText">5</text>
  <text x="842" y="664" class="name">Reserve + add</text><text x="820" y="687" class="small">inventory.reserve</text><text x="820" y="707" class="small">orders.add → db.orders</text>
  <path d="M970 684 H992" class="flowLine"/>
  <rect x="996" y="642" width="156" height="84" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="1014" cy="660" r="12" class="num"/><text x="1014" y="664" class="numText">6</text>
  <text x="1032" y="664" class="name">Persist + respond</text><text x="1010" y="687" class="small">appendAudit · write</text><text x="1010" y="707" class="small">data/db.json · HTTP 201</text>

  <rect x="946" y="50" width="14" height="14" rx="3" class="ticket"/><text x="968" y="62" class="tiny">Ticket modules</text>
</svg>
